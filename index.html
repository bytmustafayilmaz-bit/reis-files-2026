
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reis Files</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .kutu {
      width: 100%;
      max-width: 420px;
      padding: 35px 22px;
      text-align: center;
      background: #181820;
      border: 1px solid #30303c;
      border-radius: 18px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    p {
      color: #b8b8c5;
      line-height: 1.6;
    }

    .indir {
      display: block;
      margin-top: 25px;
      padding: 16px;
      background: #19b65a;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
    }

    .indir:active {
      background: #128a43;
    }

    .alt {
      margin-top: 25px;
      font-size: 12px;
      color: #777784;
    }
  </style>
</head>
<body>
  <div class="kutu">
    <h1>Reis Files</h1>
    <p>Dosya indirme merkezine hoş geldin.</p>
    <p>IPA dosyasını indirmek için aşağıdaki düğmeye bas.</p>

    <a class="indir"
       href="https://drive.google.com/file/d/1B6cgmOKV8itTwmOGatCe5Pi4wmb5dW9Q/view"
       target="_blank"
       rel="noopener noreferrer">
      IPA İndir
    </a>

    <div class="alt">Reis Files © 2026</div>
  </div>
</body>
</html>
